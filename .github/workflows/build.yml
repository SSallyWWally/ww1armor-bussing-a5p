name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-log.txt
      - name: Check mixin targets resolved
        run: |
          if grep -iE "cannot find target|unable to locate|No refMap|not found in target" build-log.txt; then
            echo "Mixin target problem"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ww1armor-jar
          path: build/libs/*.jar
      - name: Publish jar to the "jar" branch
        if: always()
        run: |
          mkdir out && (cp build/libs/*.jar out/ || true) && cp build-log.txt out/
          cd out && git init -q -b jar
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" jar
